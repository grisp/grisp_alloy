# Firmware configuration file for Raspberry Pi Zero W on Linux
#
# Reuses nerves_system_rpi0's BOOT MECHANISM (no bootloader, VideoCore GPU
# firmware loads the kernel directly, `tryboot_a_b` drives A/B) with
# system_kontron-albl-imx8mm/fwup.conf's RUNTIME CONVENTIONS (same
# GRISP_FW_* defines, same uboot-env schema, same task vocabulary).
#
# The rpi0w-specific bridge for the missing U-Boot: validate.{a,b} and
# rollback.{a,b} rewrite autoboot.txt on the AUTOBOOT FAT partition so
# the next NORMAL reboot (not tryboot) boots the chosen slot. Without this
# the GPU firmware's [all] section of autoboot.txt would keep pointing
# at the pre-upgrade slot.

require-fwup-version="1.4.0"

define(ALLOY_ENV_VER, "1")

#
# Firmware metadata
#
# All of these can be overridden using environment variables of the same name.
#
#   Run 'fwup -m' to query values in a .fw file.
#   Use 'fw_printenv' to query values on the target.
#
define(GRISP_FW_PRODUCT, "GRiSP RPi Zero W Firmware")
define(GRISP_FW_DESCRIPTION, "")
define(GRISP_FW_VERSION, "")
define(GRISP_FW_PLATFORM, "rpi0w")
define(GRISP_FW_ARCHITECTURE, "arm-unknown-linux-gnueabihf")
define(GRISP_FW_AUTHOR, "Peer Stritzinger GmbH")
define(GRISP_FW_VCS_IDENTIFIER, "")
define(GRISP_FW_MISC, "")

# Partition layout and uboot-env offsets (see fwup_include/fwup-common.conf).
include("${GRISP_SYSTEM}/images/fwup_include/fwup-common.conf")

# Default host paths if not specified on the commandline. All of these live
# in $BINARIES_DIR after build-sdk.sh and post-build.sh have run.
define(ROOTFS,        "${GRISP_TARGET_SYSTEM}/images/rootfs.squashfs")
define(BOOTCODE_BIN,  "${GRISP_SYSTEM}/images/rpi-firmware/bootcode.bin")
define(START_ELF,     "${GRISP_SYSTEM}/images/rpi-firmware/start_x.elf")
define(FIXUP_DAT,     "${GRISP_SYSTEM}/images/rpi-firmware/fixup_x.dat")
define(CONFIG_TXT,    "${GRISP_SYSTEM}/images/config.txt")
define(CMDLINE_A_TXT, "${GRISP_SYSTEM}/images/cmdline-a.txt")
define(CMDLINE_B_TXT, "${GRISP_SYSTEM}/images/cmdline-b.txt")
define(AUTOBOOT_A_TXT,"${GRISP_SYSTEM}/images/autoboot-a.txt")
define(AUTOBOOT_B_TXT,"${GRISP_SYSTEM}/images/autoboot-b.txt")
define(ZIMAGE,        "${GRISP_SYSTEM}/images/zImage")
define(DTB_PIZERO,    "${GRISP_SYSTEM}/images/bcm2708-rpi-zero.dtb")
define(DTB_PIZERO_W,  "${GRISP_SYSTEM}/images/bcm2708-rpi-zero-w.dtb")
define(DTBO_DWC2,     "${GRISP_SYSTEM}/images/rpi-firmware/overlays/dwc2.dtbo")
define(DTBO_MINIUART, "${GRISP_SYSTEM}/images/rpi-firmware/overlays/miniuart-bt.dtbo")
# ramoops.dtbo is built by upstream RPi kernel overlays (arch/arm/boot/dts/
# overlays/ramoops.dtbo) and lands in $BINARIES_DIR/rpi-firmware/overlays/
# alongside the others — no custom DTS needed. Reserves a small RAM region
# for pstore so kernel oopses survive a soft reboot.
define(DTBO_RAMOOPS,  "${GRISP_SYSTEM}/images/rpi-firmware/overlays/ramoops.dtbo")

# Firmware archive metadata (.fw -> `fwup -m`).
meta-product = ${GRISP_FW_PRODUCT}
meta-description = ${GRISP_FW_DESCRIPTION}
meta-version = ${GRISP_FW_VERSION}
meta-platform = ${GRISP_FW_PLATFORM}
meta-architecture = ${GRISP_FW_ARCHITECTURE}
meta-author = ${GRISP_FW_AUTHOR}
meta-vcs-identifier = ${GRISP_FW_VCS_IDENTIFIER}
meta-misc = ${GRISP_FW_MISC}

#
# File resources
#
# Declaration order is the order fwup processes them during a .fw stream,
# so keep boot-critical small files first and the big squashfs last.
#
file-resource bootcode.bin {
    host-path = ${BOOTCODE_BIN}
}
file-resource start.elf {
    host-path = ${START_ELF}
}
file-resource fixup.dat {
    host-path = ${FIXUP_DAT}
}
file-resource config.txt {
    host-path = ${CONFIG_TXT}
}
file-resource autoboot-a.txt {
    host-path = ${AUTOBOOT_A_TXT}
}
file-resource autoboot-b.txt {
    host-path = ${AUTOBOOT_B_TXT}
}
file-resource cmdline-a.txt {
    host-path = ${CMDLINE_A_TXT}
}
file-resource cmdline-b.txt {
    host-path = ${CMDLINE_B_TXT}
}
file-resource zImage {
    host-path = ${ZIMAGE}
}
file-resource bcm2708-rpi-zero.dtb {
    host-path = ${DTB_PIZERO}
}
file-resource bcm2708-rpi-zero-w.dtb {
    host-path = ${DTB_PIZERO_W}
}
file-resource overlays/dwc2.dtbo {
    host-path = ${DTBO_DWC2}
}
file-resource overlays/miniuart-bt.dtbo {
    host-path = ${DTBO_MINIUART}
}
file-resource overlays/ramoops.dtbo {
    host-path = ${DTBO_RAMOOPS}
}
file-resource rootfs.img {
    host-path = ${ROOTFS}
    # Error out if the rootfs exceeds the partition size.
    assert-size-lte = ${ROOTFS_A_PART_COUNT}
}

#
# MBR: 3 FAT primaries (AUTOBOOT + BOOT-A + BOOT-B), one extended container
# (primary 3) holding 3 logical partitions (ROOTFS-A, ROOTFS-B, APP).
#
mbr mbr {
    # Primary 0: AUTOBOOT (boot flag) — GPU ROM loads bootcode.bin from here.
    partition 0 {
        block-offset = ${AUTOBOOT_PART_OFFSET}
        block-count = ${AUTOBOOT_PART_COUNT}
        type = 0x0c        # FAT32 LBA
        boot = true
    }
    # Primary 1: BOOT-A — needs boot=true for tryboot's `boot_partition=2`
    # redirect to work. Without it, BCM2835 bootcode.bin refuses to follow
    # autoboot.txt into this slot and stalls with 4 green blinks.
    # Matches nerves_system_rpi0 (fwup-common.conf partition 1).
    partition 1 {
        block-offset = ${BOOT_A_PART_OFFSET}
        block-count = ${BOOT_A_PART_COUNT}
        type = 0x0c        # FAT32 LBA
        boot = true
    }
    # Primary 2: BOOT-B — boot=true for the same reason as BOOT-A.
    partition 2 {
        block-offset = ${BOOT_B_PART_OFFSET}
        block-count = ${BOOT_B_PART_COUNT}
        type = 0x0c        # FAT32 LBA
        boot = true
    }
    # Primary 3: Extended container — holds 3 logical partitions.
    partition 3 {
        block-offset = ${EXTENDED_PART_OFFSET}
        block-count = ${EXTENDED_PART_COUNT}
        type = 0x0f        # Extended LBA
        expand = true      # grow to fill the SD card; logical APP uses the slack
    }
    # Logical 1 = /dev/mmcblk0p5
    partition 4 {
        block-offset = ${ROOTFS_A_PART_OFFSET}
        block-count = ${ROOTFS_A_PART_COUNT}
        type = 0x83        # Linux
    }
    # Logical 2 = /dev/mmcblk0p6
    partition 5 {
        block-offset = ${ROOTFS_B_PART_OFFSET}
        block-count = ${ROOTFS_B_PART_COUNT}
        type = 0x83        # Linux
    }
    # Logical 3 = /dev/mmcblk0p7
    partition 6 {
        block-offset = ${APP_PART_OFFSET}
        block-count = ${APP_PART_COUNT}
        type = 0x83        # Linux
    }
}

# Single 8 KiB uboot-env at block 16. No redundant copy: without U-Boot
# nothing atomic-reads this at boot time, so a second copy buys nothing.
uboot-environment uboot-env {
    block-offset = ${UBOOT_ENV_OFFSET}
    block-count = ${UBOOT_ENV_COUNT}
}

#
# Factory / full-reflash task.
#
# Writes MBR, formats all three FAT partitions, stages the boot payload
# onto AUTOBOOT + BOOT-A + BOOT-B, writes rootfs to ROOTFS-A, invalidates
# ROOTFS-B and APP so first boot auto-formats APP, and initialises the
# full uboot-env schema to the grisp_alloy factory-default values.
#
task complete {
    # Only match if not mounted.
    require-unmounted-destination = true

    on-init {
        info("Starting GRiSP RPi Zero W firmware setup")
        mbr_write(mbr)

        fat_mkfs(${AUTOBOOT_PART_OFFSET}, ${AUTOBOOT_PART_COUNT})
        fat_setlabel(${AUTOBOOT_PART_OFFSET}, "AUTOBOOT")
        # BCM2835 bootcode.bin (rpi-firmware 1.20250915) refuses to process
        # autoboot.txt if its own partition has no config.txt. Without this an
        # empty config.txt the board stalls at 4 green blinks even though every
        # other boot artifact is in place. Nerves hits the same trap — see
        # nerves_system_rpi0/fwup.conf `complete` task, same fat_touch call.
        fat_touch(${AUTOBOOT_PART_OFFSET}, "config.txt")

        fat_mkfs(${BOOT_A_PART_OFFSET}, ${BOOT_A_PART_COUNT})
        fat_setlabel(${BOOT_A_PART_OFFSET}, "BOOT-A")
        fat_mkdir(${BOOT_A_PART_OFFSET}, "overlays")

        fat_mkfs(${BOOT_B_PART_OFFSET}, ${BOOT_B_PART_COUNT})
        fat_setlabel(${BOOT_B_PART_OFFSET}, "BOOT-B")
        fat_mkdir(${BOOT_B_PART_OFFSET}, "overlays")

        # Clear out any old data in the rootfs + app partitions.
        trim(${ROOTFS_A_PART_OFFSET}, ${ROOTFS_A_PART_COUNT})
        trim(${ROOTFS_B_PART_OFFSET}, ${ROOTFS_B_PART_COUNT})
        trim(${APP_PART_OFFSET},     ${APP_PART_COUNT})

        # Wipe and re-seed the uboot-env KV store with the canonical
        # grisp_alloy factory schema (byte-for-byte equivalent to
        # system_kontron-albl-imx8mm/fwup.conf:230-272).
        uboot_clearenv(uboot-env)

        uboot_setenv(uboot-env, "alloy_env_ver",       "${ALLOY_ENV_VER}")
        uboot_setenv(uboot-env, "valid_system",        "a")
        uboot_setenv(uboot-env, "active_system",       "a")
        uboot_setenv(uboot-env, "upgrade_available",   "0")
        uboot_setenv(uboot-env, "upgrade_fallback",    "0")
        uboot_setenv(uboot-env, "rollback_available",  "0")
        uboot_setenv(uboot-env, "bootcount",           "0")

        uboot_setenv(uboot-env, "system_platform",     "${GRISP_FW_PLATFORM}")
        uboot_setenv(uboot-env, "system_architecture", "${GRISP_FW_ARCHITECTURE}")

        # System A factory metadata (UUID is filled from the .fw itself).
        uboot_setenv(uboot-env, "systema_firmware_uuid",    "\${FWUP_META_UUID}")
        uboot_setenv(uboot-env, "systema_firmware_version", ${GRISP_FW_VERSION})
        uboot_setenv(uboot-env, "systema_firmware_vcs_id",  ${GRISP_FW_VCS_IDENTIFIER})
        uboot_setenv(uboot-env, "systema_firmware_author",  ${GRISP_FW_AUTHOR})

        # System B starts empty.
        uboot_setenv(uboot-env, "systemb_firmware_uuid",    "")
        uboot_setenv(uboot-env, "systemb_firmware_version", "")
        uboot_setenv(uboot-env, "systemb_firmware_vcs_id",  "")
        uboot_setenv(uboot-env, "systemb_firmware_author",  "")

        # Placeholder for extra kernel command-line additions (RT isolcpus,
        # ramoops address, etc.). cmdline-{a,b}.txt is the authoritative
        # source for rpi0w's actual kernel cmdline; this key is carried for
        # cross-target schema symmetry.
        uboot_setenv(uboot-env, "bootargs_extra", "")
    }

    # ---- AUTOBOOT partition: bootcode.bin + autoboot*.txt ------------------

    on-resource bootcode.bin {
        info("Staging bootcode.bin on AUTOBOOT")
        fat_write(${AUTOBOOT_PART_OFFSET}, "bootcode.bin")
    }

    on-resource autoboot-a.txt {
        # Keep a named copy for later slot swaps to fat_write onto autoboot.txt.
        fat_write(${AUTOBOOT_PART_OFFSET}, "autoboot-a.txt")
        # And make it the live autoboot.txt (slot A is the factory-default).
        # fwup forbids two fat_writes on the same resource (stream is
        # consumed after the first), so duplicate inside the FAT via fat_cp.
        fat_cp(${AUTOBOOT_PART_OFFSET}, "autoboot-a.txt", "autoboot.txt")
    }

    on-resource autoboot-b.txt {
        fat_write(${AUTOBOOT_PART_OFFSET}, "autoboot-b.txt")
    }

    # ---- BOOT-A partition: full boot payload -------------------------------
    #
    # Factory flash populates slot A only; BOOT-B is left empty until the
    # first `upgrade.b` (which writes every BOOT-B asset itself — see the
    # upgrade.b task below). fwup's stream model forbids `fat_write`-ing the
    # same resource to two different FATs in a single `on-resource`, and
    # `fat_cp` only works inside one FAT. Matching Nerves' rpi0 behaviour is
    # the simplest correct fix: before `upgrade.b <newer.fw>` there is no
    # scenario in which tryboot-to-B would succeed anyway, since both slots
    # would then need the same `rootfs.img` and env state.

    on-resource start.elf             { fat_write(${BOOT_A_PART_OFFSET}, "start.elf") }
    on-resource fixup.dat             { fat_write(${BOOT_A_PART_OFFSET}, "fixup.dat") }
    on-resource config.txt            { fat_write(${BOOT_A_PART_OFFSET}, "config.txt") }
    on-resource cmdline-a.txt         { fat_write(${BOOT_A_PART_OFFSET}, "cmdline.txt") }
    on-resource zImage                { fat_write(${BOOT_A_PART_OFFSET}, "zImage") }
    on-resource bcm2708-rpi-zero.dtb  { fat_write(${BOOT_A_PART_OFFSET}, "bcm2708-rpi-zero.dtb") }
    on-resource bcm2708-rpi-zero-w.dtb{ fat_write(${BOOT_A_PART_OFFSET}, "bcm2708-rpi-zero-w.dtb") }
    on-resource overlays/dwc2.dtbo        { fat_write(${BOOT_A_PART_OFFSET}, "overlays/dwc2.dtbo") }
    on-resource overlays/miniuart-bt.dtbo { fat_write(${BOOT_A_PART_OFFSET}, "overlays/miniuart-bt.dtbo") }
    on-resource overlays/ramoops.dtbo     { fat_write(${BOOT_A_PART_OFFSET}, "overlays/ramoops.dtbo") }

    # cmdline-b.txt is in the archive but intentionally unreferenced here —
    # the upgrade.b task consumes it. Unreferenced resources are skipped.

    # ---- Rootfs ------------------------------------------------------------

    on-resource rootfs.img {
        info("Writing root filesystem to partition A")
        raw_write(${ROOTFS_A_PART_OFFSET})
    }

    on-finish {
        info("Finalising firmware")

        # Invalidate ROOTFS-B so the old squashfs (if any) isn't accidentally
        # boot-matched by cmdline-b.txt before upgrade.b writes a real one.
        raw_memset(${ROOTFS_B_PART_OFFSET}, 256, 0xff)

        # Invalidate APP so first-boot corrupt-detect formats it cleanly.
        raw_memset(${APP_PART_OFFSET}, 256, 0xff)

        info("Firmware setup done")
    }
}

#
# A/B upgrade tasks (kontron vocabulary; rpi0w-specific post-write action:
# reboot_param("0 tryboot")).
#

# Upgrade system A while running from system B.
task upgrade.a {
    require-uboot-variable(uboot-env, "alloy_env_ver", "${ALLOY_ENV_VER}")
    require-path-at-offset("/", ${ROOTFS_B_PART_OFFSET})
    require-uboot-variable(uboot-env, "active_system", "b")
    require-uboot-variable(uboot-env, "valid_system",  "b")
    require-uboot-variable(uboot-env, "system_platform",     "${GRISP_FW_PLATFORM}")
    require-uboot-variable(uboot-env, "system_architecture", "${GRISP_FW_ARCHITECTURE}")

    on-init {
        info("Upgrading system A (currently running from B)")

        # Any previously-staged upgrade will be overwritten.
        uboot_setenv(uboot-env, "upgrade_available",  "0")
        uboot_setenv(uboot-env, "rollback_available", "0")

        # Reset system A metadata.
        uboot_setenv(uboot-env, "systema_firmware_uuid",    "")
        uboot_setenv(uboot-env, "systema_firmware_version", "")
        uboot_setenv(uboot-env, "systema_firmware_vcs_id",  "")
        uboot_setenv(uboot-env, "systema_firmware_author",  "")

        # Discard the old rootfs.
        trim(${ROOTFS_A_PART_OFFSET}, ${ROOTFS_A_PART_COUNT})
    }

    # BOOT-A payload.
    on-resource start.elf             { fat_write(${BOOT_A_PART_OFFSET}, "start.elf") }
    on-resource fixup.dat             { fat_write(${BOOT_A_PART_OFFSET}, "fixup.dat") }
    on-resource config.txt            { fat_write(${BOOT_A_PART_OFFSET}, "config.txt") }
    on-resource cmdline-a.txt         { fat_write(${BOOT_A_PART_OFFSET}, "cmdline.txt") }
    on-resource zImage                { fat_write(${BOOT_A_PART_OFFSET}, "zImage") }
    on-resource bcm2708-rpi-zero.dtb  { fat_write(${BOOT_A_PART_OFFSET}, "bcm2708-rpi-zero.dtb") }
    on-resource bcm2708-rpi-zero-w.dtb{ fat_write(${BOOT_A_PART_OFFSET}, "bcm2708-rpi-zero-w.dtb") }
    on-resource overlays/dwc2.dtbo        { fat_write(${BOOT_A_PART_OFFSET}, "overlays/dwc2.dtbo") }
    on-resource overlays/miniuart-bt.dtbo { fat_write(${BOOT_A_PART_OFFSET}, "overlays/miniuart-bt.dtbo") }
    on-resource overlays/ramoops.dtbo     { fat_write(${BOOT_A_PART_OFFSET}, "overlays/ramoops.dtbo") }

    on-resource rootfs.img {
        raw_write(${ROOTFS_A_PART_OFFSET})
    }

    on-finish {
        uboot_setenv(uboot-env, "systema_firmware_uuid",    "\${FWUP_META_UUID}")
        uboot_setenv(uboot-env, "systema_firmware_version", ${GRISP_FW_VERSION})
        uboot_setenv(uboot-env, "systema_firmware_vcs_id",  ${GRISP_FW_VCS_IDENTIFIER})
        uboot_setenv(uboot-env, "systema_firmware_author",  ${GRISP_FW_AUTHOR})
        uboot_setenv(uboot-env, "bootcount",          "0")
        uboot_setenv(uboot-env, "upgrade_available",  "1")
        uboot_setenv(uboot-env, "upgrade_fallback",   "0")

        # Predict the tryboot outcome: next boot targets A. Without a
        # bootloader nothing would otherwise update active_system, so
        # status.a.upgraded queries during the validation window
        # depend on this being set here.
        uboot_setenv(uboot-env, "active_system", "a")

        info("System A upgraded; rebooting into tryboot slot A")
        # GPU firmware honours [tryboot] in autoboot.txt for exactly one
        # boot, then falls back to [all] unless sticky-switched by
        # validate.a (which rewrites autoboot.txt).
        reboot_param("0 tryboot")
    }

    on-error { }
}

# Upgrade system B while running from system A.
task upgrade.b {
    require-uboot-variable(uboot-env, "alloy_env_ver", "${ALLOY_ENV_VER}")
    require-path-at-offset("/", ${ROOTFS_A_PART_OFFSET})
    require-uboot-variable(uboot-env, "active_system", "a")
    require-uboot-variable(uboot-env, "valid_system",  "a")
    require-uboot-variable(uboot-env, "system_platform",     "${GRISP_FW_PLATFORM}")
    require-uboot-variable(uboot-env, "system_architecture", "${GRISP_FW_ARCHITECTURE}")

    on-init {
        info("Upgrading system B (currently running from A)")

        uboot_setenv(uboot-env, "upgrade_available",  "0")
        uboot_setenv(uboot-env, "rollback_available", "0")

        uboot_setenv(uboot-env, "systemb_firmware_uuid",    "")
        uboot_setenv(uboot-env, "systemb_firmware_version", "")
        uboot_setenv(uboot-env, "systemb_firmware_vcs_id",  "")
        uboot_setenv(uboot-env, "systemb_firmware_author",  "")

        trim(${ROOTFS_B_PART_OFFSET}, ${ROOTFS_B_PART_COUNT})
    }

    on-resource start.elf             { fat_write(${BOOT_B_PART_OFFSET}, "start.elf") }
    on-resource fixup.dat             { fat_write(${BOOT_B_PART_OFFSET}, "fixup.dat") }
    on-resource config.txt            { fat_write(${BOOT_B_PART_OFFSET}, "config.txt") }
    on-resource cmdline-b.txt         { fat_write(${BOOT_B_PART_OFFSET}, "cmdline.txt") }
    on-resource zImage                { fat_write(${BOOT_B_PART_OFFSET}, "zImage") }
    on-resource bcm2708-rpi-zero.dtb  { fat_write(${BOOT_B_PART_OFFSET}, "bcm2708-rpi-zero.dtb") }
    on-resource bcm2708-rpi-zero-w.dtb{ fat_write(${BOOT_B_PART_OFFSET}, "bcm2708-rpi-zero-w.dtb") }
    on-resource overlays/dwc2.dtbo        { fat_write(${BOOT_B_PART_OFFSET}, "overlays/dwc2.dtbo") }
    on-resource overlays/miniuart-bt.dtbo { fat_write(${BOOT_B_PART_OFFSET}, "overlays/miniuart-bt.dtbo") }
    on-resource overlays/ramoops.dtbo     { fat_write(${BOOT_B_PART_OFFSET}, "overlays/ramoops.dtbo") }

    on-resource rootfs.img {
        raw_write(${ROOTFS_B_PART_OFFSET})
    }

    on-finish {
        uboot_setenv(uboot-env, "systemb_firmware_uuid",    "\${FWUP_META_UUID}")
        uboot_setenv(uboot-env, "systemb_firmware_version", ${GRISP_FW_VERSION})
        uboot_setenv(uboot-env, "systemb_firmware_vcs_id",  ${GRISP_FW_VCS_IDENTIFIER})
        uboot_setenv(uboot-env, "systemb_firmware_author",  ${GRISP_FW_AUTHOR})
        uboot_setenv(uboot-env, "bootcount",          "0")
        uboot_setenv(uboot-env, "upgrade_available",  "1")
        uboot_setenv(uboot-env, "upgrade_fallback",   "0")
        uboot_setenv(uboot-env, "active_system",      "b")

        info("System B upgraded; rebooting into tryboot slot B")
        reboot_param("0 tryboot")
    }

    on-error { }
}

# Unexpected running-state (e.g. mounted rootfs offset matches neither A nor B).
task upgrade.unexpected {
    require-uboot-variable(uboot-env, "alloy_env_ver",       ${ALLOY_ENV_VER})
    require-uboot-variable(uboot-env, "system_platform",     ${GRISP_FW_PLATFORM})
    require-uboot-variable(uboot-env, "system_architecture", ${GRISP_FW_ARCHITECTURE})
    on-init {
        error("Current system is not validated, or neither system A or B is active.")
    }
}

# env_ver/platform/architecture mismatch (wrong image for this device).
task upgrade.wrongplatform {
    on-init {
        error("Expecting alloy_env_ver=${ALLOY_ENV_VER}, platform=${GRISP_FW_PLATFORM} and architecture=${GRISP_FW_ARCHITECTURE}")
    }
}

#
# Validation tasks.
#
# Called by userland after a successful tryboot to make the new slot sticky.
# rpi0w-specific: also rewrite autoboot.txt on AUTOBOOT so the next normal
# (non-tryboot) reboot picks the same slot.
#

task validate.a {
    require-uboot-variable(uboot-env, "alloy_env_ver",       "${ALLOY_ENV_VER}")
    require-uboot-variable(uboot-env, "system_platform",     "${GRISP_FW_PLATFORM}")
    require-uboot-variable(uboot-env, "system_architecture", "${GRISP_FW_ARCHITECTURE}")
    require-path-at-offset("/", ${ROOTFS_A_PART_OFFSET})
    require-uboot-variable(uboot-env, "active_system", "a")
    require-uboot-variable(uboot-env, "upgrade_available", "1")

    on-init {
        info("Validating system A")
        uboot_setenv(uboot-env, "upgrade_available",  "0")
        uboot_setenv(uboot-env, "upgrade_fallback",   "0")
        uboot_setenv(uboot-env, "valid_system",       "a")
        uboot_setenv(uboot-env, "bootcount",          "0")
        uboot_setenv(uboot-env, "rollback_available", "1")
    }

    # Make the slot switch sticky: next NORMAL reboot (no tryboot) boots A.
    on-resource autoboot-a.txt {
        fat_write(${AUTOBOOT_PART_OFFSET}, "autoboot.txt")
    }

    on-finish {
        info("System A validated; autoboot.txt now points at A")
    }
}

task validate.b {
    require-uboot-variable(uboot-env, "alloy_env_ver",       "${ALLOY_ENV_VER}")
    require-uboot-variable(uboot-env, "system_platform",     "${GRISP_FW_PLATFORM}")
    require-uboot-variable(uboot-env, "system_architecture", "${GRISP_FW_ARCHITECTURE}")
    require-path-at-offset("/", ${ROOTFS_B_PART_OFFSET})
    require-uboot-variable(uboot-env, "active_system", "b")
    require-uboot-variable(uboot-env, "upgrade_available", "1")

    on-init {
        info("Validating system B")
        uboot_setenv(uboot-env, "upgrade_available",  "0")
        uboot_setenv(uboot-env, "upgrade_fallback",   "0")
        uboot_setenv(uboot-env, "valid_system",       "b")
        uboot_setenv(uboot-env, "bootcount",          "0")
        uboot_setenv(uboot-env, "rollback_available", "1")
    }

    on-resource autoboot-b.txt {
        fat_write(${AUTOBOOT_PART_OFFSET}, "autoboot.txt")
    }

    on-finish {
        info("System B validated; autoboot.txt now points at B")
    }
}

task validate.unavailable {
    require-uboot-variable(uboot-env, "alloy_env_ver",       ${ALLOY_ENV_VER})
    require-uboot-variable(uboot-env, "system_platform",     ${GRISP_FW_PLATFORM})
    require-uboot-variable(uboot-env, "system_architecture", ${GRISP_FW_ARCHITECTURE})
    on-init {
        error("No upgrade pending: nothing to validate.")
    }
}

task validate.wrongplatform {
    on-init {
        error("Expecting alloy_env_ver=${ALLOY_ENV_VER}, platform=${GRISP_FW_PLATFORM} and architecture=${GRISP_FW_ARCHITECTURE}")
    }
}

#
# Rollback tasks.
#
# Explicit operator action: while on the currently-active slot, switch the
# live autoboot.txt to the OTHER slot so the next reboot lands there. No
# tryboot involved — rollback is immediate and non-one-shot.
#

task rollback.a {
    require-uboot-variable(uboot-env, "alloy_env_ver",       "${ALLOY_ENV_VER}")
    require-uboot-variable(uboot-env, "system_platform",     "${GRISP_FW_PLATFORM}")
    require-uboot-variable(uboot-env, "system_architecture", "${GRISP_FW_ARCHITECTURE}")
    require-path-at-offset("/", ${ROOTFS_B_PART_OFFSET})
    require-uboot-variable(uboot-env, "active_system", "b")
    require-uboot-variable(uboot-env, "rollback_available", "1")
    require-uboot-variable(uboot-env, "upgrade_available",  "0")

    on-init {
        info("Rolling back to system A (currently running from B)")

        uboot_setenv(uboot-env, "valid_system",       "a")
        uboot_setenv(uboot-env, "bootcount",          "0")
        uboot_setenv(uboot-env, "upgrade_available",  "0")
        uboot_setenv(uboot-env, "upgrade_fallback",   "0")

        uboot_setenv(uboot-env, "systemb_firmware_uuid",    "")
        uboot_setenv(uboot-env, "systemb_firmware_version", "")
        uboot_setenv(uboot-env, "systemb_firmware_vcs_id",  "")
        uboot_setenv(uboot-env, "systemb_firmware_author",  "")

        # Rollback is one-shot until the next successful validation.
        uboot_setenv(uboot-env, "rollback_available", "0")
    }

    # Point the GPU at A on the next normal reboot.
    on-resource autoboot-a.txt {
        fat_write(${AUTOBOOT_PART_OFFSET}, "autoboot.txt")
    }

    on-finish {
        info("Reboot to complete rollback to A")
    }
}

task rollback.b {
    require-uboot-variable(uboot-env, "alloy_env_ver",       "${ALLOY_ENV_VER}")
    require-uboot-variable(uboot-env, "system_platform",     "${GRISP_FW_PLATFORM}")
    require-uboot-variable(uboot-env, "system_architecture", "${GRISP_FW_ARCHITECTURE}")
    require-path-at-offset("/", ${ROOTFS_A_PART_OFFSET})
    require-uboot-variable(uboot-env, "active_system", "a")
    require-uboot-variable(uboot-env, "rollback_available", "1")
    require-uboot-variable(uboot-env, "upgrade_available",  "0")

    on-init {
        info("Rolling back to system B (currently running from A)")

        uboot_setenv(uboot-env, "valid_system",       "b")
        uboot_setenv(uboot-env, "bootcount",          "0")
        uboot_setenv(uboot-env, "upgrade_available",  "0")
        uboot_setenv(uboot-env, "upgrade_fallback",   "0")

        uboot_setenv(uboot-env, "systema_firmware_uuid",    "")
        uboot_setenv(uboot-env, "systema_firmware_version", "")
        uboot_setenv(uboot-env, "systema_firmware_vcs_id",  "")
        uboot_setenv(uboot-env, "systema_firmware_author",  "")

        uboot_setenv(uboot-env, "rollback_available", "0")
    }

    on-resource autoboot-b.txt {
        fat_write(${AUTOBOOT_PART_OFFSET}, "autoboot.txt")
    }

    on-finish {
        info("Reboot to complete rollback to B")
    }
}

task rollback.unavailable {
    require-uboot-variable(uboot-env, "alloy_env_ver",       ${ALLOY_ENV_VER})
    require-uboot-variable(uboot-env, "system_platform",     ${GRISP_FW_PLATFORM})
    require-uboot-variable(uboot-env, "system_architecture", ${GRISP_FW_ARCHITECTURE})
    on-init {
        error("Rollback is not available or safe in the current state.")
    }
}

task rollback.wrongplatform {
    on-init {
        error("Expecting alloy_env_ver=${ALLOY_ENV_VER}, platform=${GRISP_FW_PLATFORM} and architecture=${GRISP_FW_ARCHITECTURE}")
    }
}

#
# Status tasks — read-only diagnostics keyed on (active_system, valid_system,
# upgrade_available, rollback_available). Copied verbatim from kontron; the
# rpi0w-specific caveat is that there is a narrow window between a tryboot
# reboot and `fwup -t validate.<slot>` during which none of these tasks
# match (the upgrade.* on-finish predictively set active_system, but
# upgrade_available is still 1 and valid_system still points at the old
# slot — which *is* status.a.upgraded / status.b.upgraded).
#

task status.a.validated_no_rollback {
    require-uboot-variable(uboot-env, "alloy_env_ver", "${ALLOY_ENV_VER}")
    require-path-at-offset("/", ${ROOTFS_A_PART_OFFSET})
    require-uboot-variable(uboot-env, "active_system",      "a")
    require-uboot-variable(uboot-env, "valid_system",       "a")
    require-uboot-variable(uboot-env, "upgrade_available",  "0")
    require-uboot-variable(uboot-env, "rollback_available", "0")
    on-init {
        info("Status: Active=A, state=validated, reboot_needed=no, validation_needed=no, rollback_available=no")
    }
}

task status.b.validated_no_rollback {
    require-uboot-variable(uboot-env, "alloy_env_ver", "${ALLOY_ENV_VER}")
    require-path-at-offset("/", ${ROOTFS_B_PART_OFFSET})
    require-uboot-variable(uboot-env, "active_system",      "b")
    require-uboot-variable(uboot-env, "valid_system",       "b")
    require-uboot-variable(uboot-env, "upgrade_available",  "0")
    require-uboot-variable(uboot-env, "rollback_available", "0")
    on-init {
        info("Status: Active=B, state=validated, reboot_needed=no, validation_needed=no, rollback_available=no")
    }
}

task status.a.validated_with_rollback {
    require-uboot-variable(uboot-env, "alloy_env_ver", "${ALLOY_ENV_VER}")
    require-path-at-offset("/", ${ROOTFS_A_PART_OFFSET})
    require-uboot-variable(uboot-env, "active_system",      "a")
    require-uboot-variable(uboot-env, "upgrade_available",  "0")
    require-uboot-variable(uboot-env, "rollback_available", "1")
    on-init {
        info("Status: Active=A, state=validated, reboot_needed=no, validation_needed=no, rollback_available=yes")
    }
}

task status.b.validated_with_rollback {
    require-uboot-variable(uboot-env, "alloy_env_ver", "${ALLOY_ENV_VER}")
    require-path-at-offset("/", ${ROOTFS_B_PART_OFFSET})
    require-uboot-variable(uboot-env, "active_system",      "b")
    require-uboot-variable(uboot-env, "upgrade_available",  "0")
    require-uboot-variable(uboot-env, "rollback_available", "1")
    on-init {
        info("Status: Active=B, state=validated, reboot_needed=no, validation_needed=no, rollback_available=yes")
    }
}

# Upgrade staged but not yet tryboot'd.
task status.a.upgrading {
    require-uboot-variable(uboot-env, "alloy_env_ver", "${ALLOY_ENV_VER}")
    require-path-at-offset("/", ${ROOTFS_A_PART_OFFSET})
    require-uboot-variable(uboot-env, "active_system",     "a")
    require-uboot-variable(uboot-env, "upgrade_available", "1")
    require-uboot-variable(uboot-env, "valid_system",      "a")
    on-init {
        info("Status: Active=A, state=pending-upgrade, reboot_needed=yes, validation_needed=pending-reboot, rollback_available=no")
    }
}

task status.b.upgrading {
    require-uboot-variable(uboot-env, "alloy_env_ver", "${ALLOY_ENV_VER}")
    require-path-at-offset("/", ${ROOTFS_B_PART_OFFSET})
    require-uboot-variable(uboot-env, "active_system",     "b")
    require-uboot-variable(uboot-env, "upgrade_available", "1")
    require-uboot-variable(uboot-env, "valid_system",      "b")
