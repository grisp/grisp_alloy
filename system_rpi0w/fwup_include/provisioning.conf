# fwup provisioning include for system_rpi0w.
#
# Intentionally empty today. Populate here with per-device first-boot
# provisioning logic (serial numbers, Wi-Fi regulatory domain, crypto
# chip factory keys, etc.) when that pipeline lands. Mirrors the way
# nerves_system_rpi0's fwup_include/provisioning.conf is used as a
# per-device hook point without making the main fwup.conf grow every
# time a factory step is added.
