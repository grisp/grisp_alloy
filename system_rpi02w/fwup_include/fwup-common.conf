# fwup common definitions for system_rpi02w.
#
# Included by system_rpi02w/fwup.conf to share partition offsets, counts and
# the `uboot-env` KV block between tasks. All values are in 512-byte blocks.
#
# The 7-partition MBR layout below (AUTOBOOT + BOOT-A/B FAT + extended
# container with ROOTFS-A/B + APP) intentionally matches system_rpi0w.
# ROOTFS and APP sizes are tuned to match
# system_grisp2 / system_kontron-albl-imx8mm for
# cross-target consistency. rootfs_overlay/etc/fw_env.config must stay in
# sync with UBOOT_ENV_OFFSET / UBOOT_ENV_COUNT.
#
# Partition layout (MBR, 7 entries: 3 primary + extended with 3 logical):
#
#   block 0       MBR
#   block 16      uboot-env KV store (8 KiB, no redundancy)
#   block 2048    AUTOBOOT    (FAT, boot flag, 16 MiB) -> /dev/mmcblk0p1
#   block 34816   BOOT-A      (FAT,            32 MiB) -> /dev/mmcblk0p2
#   block 100352  BOOT-B      (FAT,            32 MiB) -> /dev/mmcblk0p3
#   block 165888  Extended container (primary 3)      -> /dev/mmcblk0p4
#     block 167936  ROOTFS-A  (squashfs,     140 MiB) -> /dev/mmcblk0p5
#     block 456704  ROOTFS-B  (squashfs,     140 MiB) -> /dev/mmcblk0p6
#     block 745472  APP       (ext4, expand, 512 MiB) -> /dev/mmcblk0p7
#
# Rationale:
# - AUTOBOOT is MBR primary 0 with boot=true so the BCM2835 VideoCore
#   firmware finds bootcode.bin + autoboot.txt there first. The GPU then
#   jumps to BOOT-A (primary 1 = mmcblk0p2) or BOOT-B (primary 2 = p3)
#   based on autoboot.txt / tryboot.
# - ROOTFS sizes (140 MiB) match system_grisp2 so a grisp2-sized squashfs
#   will fit here too.
# - APP size (512 MiB) matches both grisp2 and kontron for cross-target
#   consistency; the `expand = true` flag lets fwup grow it to fill the
#   SD card at factory-flash time.
# - EBR chain headers between logical partitions get a 2048-block (1 MiB)
#   gap so the logical partition data stays 1 MiB aligned.

# --- uboot-env KV store (8 KiB, single copy) --------------------------------

define(UBOOT_ENV_OFFSET, 16)       # 0x2000 bytes = 16 * 512
define(UBOOT_ENV_COUNT,  16)       # 0x2000 bytes (8 KiB), 1 sector = 0x200

# --- Partition sizes (all in 512-byte blocks) ------------------------------

define(AUTOBOOT_PART_COUNT, 32768)     # 16 MiB
define(BOOT_A_PART_COUNT,   65536)     # 32 MiB
define(BOOT_B_PART_COUNT,   65536)     # 32 MiB
define(ROOTFS_A_PART_COUNT, 286720)    # 140 MiB (matches system_grisp2)
define(ROOTFS_B_PART_COUNT, 286720)    # 140 MiB
define(APP_PART_COUNT,      1048576)   # 512 MiB (expand = true)

# Offset of the first logical partition inside the extended container leaves
# 2048 blocks (1 MiB) for the primary EBR. Between consecutive logical
# partitions we leave the same gap for chained EBRs.
define(EBR_GAP, 2048)

# --- Partition offsets -----------------------------------------------------

define(AUTOBOOT_PART_OFFSET, 2048)     # 1 MiB

define-eval(BOOT_A_PART_OFFSET,
            "${AUTOBOOT_PART_OFFSET} + ${AUTOBOOT_PART_COUNT}")

define-eval(BOOT_B_PART_OFFSET,
            "${BOOT_A_PART_OFFSET} + ${BOOT_A_PART_COUNT}")

# Extended container starts right after BOOT-B. Its size is the sum of the
# three logical partitions plus their EBR gaps. (APP has expand=true so its
# effective size at factory-flash time is whatever is left on the SD card.)
define-eval(EXTENDED_PART_OFFSET,
            "${BOOT_B_PART_OFFSET} + ${BOOT_B_PART_COUNT}")

define-eval(EXTENDED_PART_COUNT,
            "${EBR_GAP} + ${ROOTFS_A_PART_COUNT} + \
             ${EBR_GAP} + ${ROOTFS_B_PART_COUNT} + \
             ${EBR_GAP} + ${APP_PART_COUNT}")

define-eval(ROOTFS_A_PART_OFFSET,
            "${EXTENDED_PART_OFFSET} + ${EBR_GAP}")

define-eval(ROOTFS_B_PART_OFFSET,
            "${ROOTFS_A_PART_OFFSET} + ${ROOTFS_A_PART_COUNT} + ${EBR_GAP}")

define-eval(APP_PART_OFFSET,
            "${ROOTFS_B_PART_OFFSET} + ${ROOTFS_B_PART_COUNT} + ${EBR_GAP}")
