# fwup common definitions for system_rpi02w.
#
# Keep the SD geometry aligned with nerves_system_rpi0_2. The Raspberry Pi
# boot ROM/firmware stack is sensitive to partition placement, and these
# offsets/counts are known-good on Pi Zero 2 W.
#
# Values are 512-byte blocks.

# --- uboot-env KV store (8 KiB, single copy) -------------------------------

define(UBOOT_ENV_OFFSET, 16)
define(UBOOT_ENV_COUNT, 16)

# --- Partition layout -------------------------------------------------------
# Primary partitions:
#   p1 (entry 0): AUTOBOOT
#   p2 (entry 1): BOOT-A
#   p3 (entry 2): BOOT-B
#   p4 (entry 3): Extended container
# Logical partitions inside extended:
#   p5: ROOTFS-A
#   p6: ROOTFS-B
#   p7: APP (expand)
#
# This mirrors nerves_system_rpi0_2/fwup_include/fwup-common.conf.

define(BOOT_A_PART_OFFSET, 63)
define(BOOT_A_PART_COUNT, 38630)

define-eval(BOOT_B_PART_OFFSET, "${BOOT_A_PART_OFFSET} + ${BOOT_A_PART_COUNT}")
define(BOOT_B_PART_COUNT, ${BOOT_A_PART_COUNT})

define-eval(AUTOBOOT_PART_OFFSET, "${BOOT_B_PART_OFFSET} + ${BOOT_B_PART_COUNT}")
define-eval(AUTOBOOT_PART_COUNT, 32749)

define-eval(EXTENDED_PART_OFFSET, "${AUTOBOOT_PART_OFFSET} + ${AUTOBOOT_PART_COUNT}")

define(ROOTFS_A_PART_OFFSET, 110080)
define(ROOTFS_A_PART_COUNT, 272666)

define-eval(ROOTFS_B_PART_OFFSET, "${ROOTFS_A_PART_OFFSET} + ${ROOTFS_A_PART_COUNT}")
define(ROOTFS_B_PART_COUNT, ${ROOTFS_A_PART_COUNT})

define-eval(APP_PART_OFFSET, "${ROOTFS_B_PART_OFFSET} + ${ROOTFS_B_PART_COUNT}")
define(APP_PART_COUNT, 1048576)
